<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Scheduler — Loading</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    .card {
      width: 480px;
      height: 360px;
      background: linear-gradient(145deg, #12121a 0%, #1a1a2e 50%, #16213e 100%);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.6),
        0 0 80px rgba(66,133,244,0.08),
        inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 28px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.6s ease-out;
    }

    /* Animated background orbs */
    .card::before,
    .card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.3;
      animation: float 8s ease-in-out infinite;
    }
    .card::before {
      width: 200px; height: 200px;
      background: radial-gradient(circle, #4285f4, transparent);
      top: -60px; left: -40px;
    }
    .card::after {
      width: 160px; height: 160px;
      background: radial-gradient(circle, #a855f7, transparent);
      bottom: -50px; right: -30px;
      animation-delay: -4s;
    }

    /* Logo / Icon area */
    .logo-wrap {
      position: relative;
      z-index: 1;
      width: 72px; height: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-ring {
      position: absolute;
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #4285f4;
      border-right-color: #a855f7;
      animation: spin 1.5s linear infinite;
    }

    .logo-ring-inner {
      position: absolute;
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: #34d399;
      border-left-color: #f59e0b;
      animation: spin 2s linear infinite reverse;
    }

    .logo-icon {
      font-size: 28px;
      z-index: 2;
      animation: pulse 2s ease-in-out infinite;
    }

    /* Text */
    .title {
      position: relative; z-index: 1;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #4285f4 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .status {
      position: relative; z-index: 1;
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Loading dots */
    .dots {
      display: flex;
      gap: 4px;
    }
    .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #4285f4;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #a855f7; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #34d399; }

    /* Version badge */
    .version {
      position: absolute;
      bottom: 16px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.15);
      z-index: 1;
      font-weight: 500;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-8px); opacity: 1; }
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-ring-inner"></div>
      <span class="logo-icon">📧</span>
    </div>

    <div class="title">Gmail Scheduler</div>

    <div class="status">
      <span>Menyiapkan server</span>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <span class="version">Desktop v1.0.0</span>
  </div>
</body>
</html>
