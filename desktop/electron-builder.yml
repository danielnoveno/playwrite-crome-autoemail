# ---------------------------------------------------------------------------
# electron-builder configuration — Gmail Scheduler Desktop
# ---------------------------------------------------------------------------
# Run:  npm run desktop:build
# Output lands in dist-desktop/
# ---------------------------------------------------------------------------

appId: com.gmail-scheduler.desktop
productName: Gmail Scheduler

directories:
  output: dist-desktop

# (entry point comes from package.json "main": desktop/main.js)

# Files to include in the ASAR bundle
files:
  - desktop/**/*
  - server.js
  - "server/**/*"
  - "src/**/*"
  - "scripts/**/*"
  - "dashboard/frontend/dist/**/*"
  - package.json
  # Exclude heavy/unnecessary files
  - "!**/node_modules/.cache"
  - "!**/.git"
  - "!**/.env"
  - "!**/data"
  - "!**/screenshots"
  - "!**/logs"

extraResources:
  - from: desktop/icon.png
    to: icon.png

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  icon: desktop/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gmail Scheduler

portable:
  artifactName: "Gmail-Scheduler-Portable-${version}.exe"
